<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda asignaturas 😊 - AICLE</title>
<style>
:root{--ink:#222d35;--muted:#65717c;--line:#e7e8e7;--blue:#284a68;--wash:#f7f8f7;--white:#fff;--r:12px;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}
*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #6d91a8;outline-offset:3px}.container{max-width:1160px;padding:0 30px;margin:0 auto}
.mast{border-bottom:1px solid var(--line);padding:40px 0 26px}.eyebrow{font-size:11px;letter-spacing:1.25px;color:#70818b;text-transform:uppercase;font-weight:700}.mast h1{font-size:clamp(28px,4vw,40px);font-weight:600;letter-spacing:-1.1px;margin:12px 0 8px}.lead{color:var(--muted);font-size:14px;margin:0;line-height:1.55}.body{padding-top:28px;padding-bottom:58px}
.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:30px}.subject{--color:#74818b;--tint:#f2f4f5;display:flex;align-items:center;gap:10px;border:1px solid #e5e8e7;background:white;color:var(--ink);border-radius:10px;padding:13px 12px;font-size:12px;text-align:left;line-height:1.38;min-height:65px;transition:background .12s,border-color .12s}.subject:hover{background:var(--tint)}.subject.active{background:var(--tint);border-color:var(--color);box-shadow:inset 0 0 0 1px var(--color);color:var(--ink)}.stripe{height:31px;width:5px;background:var(--color);border-radius:6px;flex-shrink:0}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:13px}.toolbar h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.35px;min-width:170px}.nav{display:flex;align-items:center;gap:4px}.nav button{width:33px;height:33px;border:1px solid var(--line);background:white;border-radius:7px;font-size:22px;line-height:1}.subtle-button{background:#fff;border:1px solid #e1e5e5;color:#465a67;padding:8px 11px;border-radius:7px;font-size:12px}.tools-right{margin-left:auto;display:flex;gap:8px;align-items:center}.tools-right select{border:1px solid #e1e5e5;background:white;border-radius:7px;padding:8px 25px 8px 9px;color:#465a67;font-size:12px}
.calendar{border:1px solid var(--line);border-radius:12px;overflow:visible;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--line);gap:1px}.weekday{background:#f8f8f7;text-align:center;color:#65717b;font-size:11px;font-weight:700;padding:12px 4px}.date{background:white;min-height:130px;padding:10px 7px;overflow:visible}.date.off{background:#fbfbfb}.date.today .day-number{background:#263e53;color:white;border-radius:50%;width:24px;height:24px;line-height:24px;text-align:center;margin:-4px 0 4px -4px}.day-number{display:inline-block;color:#69747b;font-size:12px;margin-bottom:8px}.date.has-events .day-number{color:#263e53;font-weight:700}
.event{--color:#8c9398;--tint:#f1f3f4;position:relative;background:var(--tint);border-left:3px solid var(--color);padding:6px 6px;margin:0 0 5px;border-radius:6px;font-size:10.5px;line-height:1.35;color:#25333b;overflow-wrap:anywhere;transition:transform .12s ease, box-shadow .12s ease}.event:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(28,42,56,.08)}.event strong{font-weight:600}.event-top{display:flex;align-items:flex-start;gap:5px}.event-icon{font-size:12px;line-height:1;flex-shrink:0;margin-top:1px}.event-text{min-width:0}.event.is-done{background:#f5f6f5;border-left-color:#bbc5c5;color:#697579;opacity:.88}.event.is-done strong{text-decoration:line-through;text-decoration-color:#a3acac;text-decoration-thickness:1px}.done-icon{display:inline-block;font-size:11px;color:#39846c;font-weight:700;margin-right:4px}.entry.is-done h3{text-decoration:line-through;text-decoration-color:#aeb7b7;color:#697579}.entry.is-done .mark{border-left-color:#bcc7c7}.entry.is-done .subject-name{background:#f4f6f5}
.tooltip{position:absolute;left:8px;top:calc(100% + 6px);z-index:30;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .14s ease,transform .14s ease;background:#fff;border:1px solid rgba(31,48,62,.12);box-shadow:0 8px 20px rgba(31,48,62,.12);border-radius:8px;padding:7px 9px;white-space:normal;max-width:min(320px,75vw);min-width:200px;font-size:11px;color:#33444f}.tooltip::before{content:'';position:absolute;top:-6px;left:14px;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:6px solid #fff;filter:drop-shadow(0 -1px 0 rgba(31,48,62,.08))}.tooltip .chip{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--color)}.event:hover .tooltip{opacity:1;transform:translateY(0)}.date:nth-child(7n) .tooltip,.date:nth-child(7n - 1) .tooltip{left:auto;right:0}.opening{outline:1px solid #afcbd6;outline-offset:-1px}.opening-badge{display:block;width:max-content;background:#deedf5;color:#225578;border-radius:3px;padding:2px 5px;font-size:9px;letter-spacing:.35px;font-weight:700;margin-bottom:4px}.entry.opening .mark{background:#f8fbfd;border-radius:3px;padding-top:8px;padding-bottom:8px}
.below{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:42px;margin-top:34px}.section-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:15px}.section-top h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.3px}.section-top p{font-size:12px;color:var(--muted);margin:0}.timeline{border-top:1px solid var(--line)}.entry{padding:15px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:74px minmax(0,1fr);gap:14px}.entry time{color:#52636d;font-size:12px;font-weight:600}.entry h3{font-size:14px;font-weight:600;line-height:1.42;margin:0 0 6px}.entry p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.mark{--color:#8c9398;--tint:#f1f3f4;border-left:4px solid var(--color);padding:3px 0 3px 12px}.subject-name{display:inline-block;background:var(--tint);color:var(--ink);border-radius:4px;padding:3px 7px;font-size:11px;font-weight:600;margin-bottom:6px}.note{background:#fbfbfa;border:1px solid var(--line);border-radius:9px;padding:18px}.note h3{font-size:14px;margin:0 0 10px}.note p{color:#65717b;font-size:12px;line-height:1.65;margin:0 0 10px}.note p:last-child{margin-bottom:0}.note a{color:#345d78;text-decoration:underline;text-underline-offset:2px}.empty{padding:26px 6px;color:var(--muted);font-size:13px;line-height:1.6}.status{font-size:11px;color:#72818a;margin:0 0 14px;min-height:16px}.status.error{color:#9d3f3f}.sheet-link{margin-top:24px;font-size:13px}.sheet-link a,.foot a{color:#345d78;text-decoration:underline;text-underline-offset:3px}.foot{border-top:1px solid var(--line);padding:19px 0 26px;font-size:11px;color:#82909a}
@media(max-width:900px){.subjects{grid-template-columns:repeat(2,minmax(0,1fr))}.below{grid-template-columns:1fr;gap:24px}.date{min-height:95px;padding:7px 5px}.event{font-size:9px;padding:4px}.container{padding-left:18px;padding-right:18px}}
@media(max-width:540px){.subjects{gap:7px}.subject{min-height:56px;font-size:11px;padding:9px}.stripe{height:26px}.date{min-height:70px;padding:5px 3px}.weekday{font-size:10px;padding:9px 1px}.event{font-size:0;min-height:8px;width:95%;padding:0;background:var(--color);border:0;border-radius:3px;margin-bottom:4px}.event .event-top,.event .tooltip{display:none}.event.is-done{background:#b9c5c4;border-left-color:#b9c5c4}.day-number{margin-bottom:8px}.mast{padding:27px 0 20px}.tools-right{margin-left:0}.toolbar{gap:10px}.toolbar h2{font-size:18px;min-width:150px}}
</style>
</head>
<body>
<header class="mast"><div class="container"><div class="eyebrow">Máster en enseñanza bilingüe y AICLE - 2026-2027 By M. Ángel</div><a href="https://platea.ujaen.es/" target="_blank" rel="noopener noreferrer" class="moodle-link">↗ Accede al Moodle</a><h1>Agenda asignaturas 😊</h1></div></header>
<main class="container body">
<div class="subjects" id="subjects" aria-label="Filtrar por asignatura"></div>
<div class="toolbar"><div class="nav"><button id="prev" aria-label="Mes anterior">‹</button><button id="next" aria-label="Mes siguiente">›</button></div><h2 id="month"></h2><button class="subtle-button" id="today">Mes actual</button><div class="tools-right"><select id="scope" aria-label="Tipo de eventos"><option value="key">Fechas importantes</option><option value="all">Todos los eventos</option></select><button class="subtle-button" id="refresh">Actualizar ↻</button></div></div>
<p id="status" class="status" role="status">Consultando Google Sheets…</p>
<section class="calendar" id="calendar" aria-label="Calendario mensual"></section>
<div class="sheet-link"><a href="https://docs.google.com/spreadsheets/d/1_TrnA3qL_pmiVRwmEslGf1FYA0Omeudj9xv1XJ01sQE/edit" target="_blank" rel="noopener noreferrer">Abrir Google Sheets ↗</a></div>
</main><footer class="foot"><div class="container">M. Ángel Sevilla · <a href="mailto:masm0039@red.ujaen.es">masm0039@red.ujaen.es</a></div></footer>
<script>
'use strict';
const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vTafGrNpR0FNJ-a_XBfMzaI0p39K2oJaZWX__0zveIG5hQX1Dlm_CD673PtMbDPD7QBw3AfoFsP6d-e/pub?gid=0&single=true&output=csv';
const SHEETS=[{name:'¿Qué es AICLE? Orígenes, definición y caracterización',short:'¿Qué es AICLE? Orígenes, definición y caracterización (What is CLIL? Origins, Definition and Characterization)',color:'#167b82',tint:'#eaf6f5'},{name:'Student-centered Methodologies and New Technologies for CLIL',short:'Metodologías centradas en el alumnado y nuevas tecnologías para AICLE (Student-centered Methodologies and New Technologies for CLIL)',color:'#8165a2',tint:'#f3eef9'},{name:'Instrumental English for Infant Education',short:'Inglés instrumental para Educación Infantil (Instrumental English for Infant Education)',color:'#bb7b38',tint:'#fbf2e7'},{name:'B2 Instrumental English',short:'Inglés instrumental B2 (B2 Instrumental English)',color:'#578564',tint:'#eef6ef'}];
const $=s=>document.getElementById(s);let rows=[],filter='',view=new Date(2026,10,1);
function node(tag,cls,content){const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=content;return e}
function csvParse(s){let out=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){row.push(v);v=''}else if((c==='\r'||c==='\n')&&!q){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))out.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x.trim()))out.push(row);return out}
function iso(v){v=String(v||'').trim();if(/^\d{4}-\d\d-\d\d$/.test(v))return v;let m=v.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:''}
function spec(name){let n=String(name||'').trim();return SHEETS.find(x=>x.name===n)||{name:n,short:n,color:'#70828e',tint:'#f1f3f5'}}
function featuredOpening(r){return (r.subject==='Student-centered Methodologies and New Technologies for CLIL'&&[['2026-11-11','Inicio debate I'],['2026-11-25','Inicio debate II'],['2026-12-09','Inicio debate III']].some(([date,name])=>r.date===date&&r.title.trim().toLowerCase()===name.toLowerCase()))||(r.subject==='B2 Instrumental English'&&r.date==='2026-12-14'&&r.title.toLowerCase().includes('test final'));}
function visible(r){return(!filter||r.subject===filter)&&($('scope').value==='all'||(r.type.toLowerCase()!=='estudio'&&(r.type.toLowerCase()!=='apertura'||featuredOpening(r))))}
function niceDate(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}
function titleFor(r){return r.title}
function eventIcon(r){if(featuredOpening(r))return '🔓';const t=(r.type||'').toLowerCase();const title=(r.title||'').toLowerCase(); if(title.includes('sesión síncrona')||title.includes('webinar')||title.includes('videollamada')||t.includes('sesión')) return '🎤'; if(title.includes('debate')||title.includes('forum')||title.includes('foro')||title.includes('peer grading')) return '💬'; if(title.includes('test')||title.includes('prueba')||t.includes('prueba')) return '📝'; if(title.includes('trabajo final')||title.includes('final assignment')||title.includes('elaborate activity')||title.includes('assignment')||title.includes('entrega')) return '📌'; return '•';}
function renderSubjects(){let c=$('subjects');c.replaceChildren();const names=[...new Set(rows.map(r=>r.subject))];const items=[{name:'',short:'Todas las asignaturas',color:'#6f8794',tint:'#f1f4f6'},...SHEETS,...names.filter(n=>!SHEETS.some(s=>s.name===n)).map(spec)];for(const x of items){let b=node('button','subject'+(filter===x.name?' active':''));b.type='button';b.setAttribute('aria-pressed',filter===x.name?'true':'false');b.style.setProperty('--color',x.color);b.style.setProperty('--tint',x.tint||'#f1f3f5');let stripe=node('span','stripe');stripe.style.setProperty('--color',x.color);b.append(stripe,node('span',null,x.short));b.onclick=()=>{filter=x.name;renderSubjects();render()};c.append(b)}}
function render(){let label=view.toLocaleDateString('es-ES',{month:'long',year:'numeric'});$('month').textContent=label[0].toUpperCase()+label.slice(1);const cal=$('calendar');cal.replaceChildren();for(const t of ['L','M','X','J','V','S','D'])cal.append(node('div','weekday',t));const year=view.getFullYear(),month=view.getMonth(),first=new Date(year,month,1),offset=(first.getDay()+6)%7,length=new Date(year,month+1,0).getDate(),today=new Date(),data=rows.filter(visible);for(let i=0;i<Math.ceil((offset+length)/7)*7;i++){const n=i-offset+1,box=node('div','date'+(n<1||n>length?' off':''));if(n>=1&&n<=length){if(today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===n)box.classList.add('today');let date=`${year}-${String(month+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,dayEvents=data.filter(x=>x.date===date);if(dayEvents.length)box.classList.add('has-events');box.append(node('span','day-number',String(n)));for(const x of dayEvents){const s=spec(x.subject);let e=node('div','event'+(x.done?' is-done':'')+(featuredOpening(x)?' opening':''));e.style.setProperty('--color',s.color);e.style.setProperty('--tint',s.tint||'#f1f3f5');let top=node('div','event-top');top.append(node('span','event-icon',eventIcon(x)));let text=node('div','event-text');if(x.done)text.append(node('span','done-icon','✓'));if(featuredOpening(x))text.append(node('span','opening-badge','APERTURA'));text.append(node('strong',null,x.title));top.append(text);e.append(top);let tip=node('div','tooltip');const chip=node('span','chip');tip.append(chip,document.createTextNode(s.short));e.setAttribute('aria-label',s.short+': '+x.title);e.append(tip);box.append(e)}}cal.append(box)}}

async function load(){let st=$('status');st.className='status';st.textContent='Actualizando desde Google Sheets…';try{const res=await fetch(CSV+'&v='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('No se ha podido acceder al CSV ('+res.status+')');const data=csvParse((await res.text()).replace(/^\uFEFF/,''));if(!data.length){rows=[];st.textContent='La hoja está vacía. Puedes añadir las fechas directamente en Google Sheets.';renderSubjects();render();return}const h=data[0].map(x=>x.trim().toLowerCase()),find=keys=>h.findIndex(x=>keys.includes(x));let indices={date:find(['fecha','date']),subject:find(['asignatura','subject','materia']),title:find(['actividad','tarea','activity','task']),type:find(['tipo','type']),unit:find(['unidad','unit']),notes:find(['notas','notes']),status:find(['estado','status'])};if(indices.date<0||indices.subject<0||indices.title<0)throw new Error('La hoja necesita las columnas Fecha, Asignatura y Actividad');rows=data.slice(1).map(r=>Object.fromEntries(Object.entries(indices).map(([k,i])=>[k,i<0?'':String(r[i]||'').trim()]))).map(r=>({...r,date:iso(r.date),done:/^(completad[ao]|hech[ao]|finalizad[ao]|done|completed|ok|sí|si|true|verdadero)$/i.test(r.status.trim())})).filter(r=>r.date&&r.title);st.textContent=rows.length?'Datos actualizados desde Google Sheets.':'No hay actividades con fechas válidas. Utiliza el formato AAAA-MM-DD.';renderSubjects();render()}catch(e){st.textContent='No se pudieron cargar los datos desde Google Sheets. Comprueba que la publicación CSV esté disponible y que las columnas no hayan cambiado. '+e.message;st.classList.add('error');renderSubjects();render()}}
$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};$('today').onclick=()=>{let d=new Date();view=new Date(d.getFullYear(),d.getMonth(),1);render()};$('scope').onchange=render;$('refresh').onclick=load;renderSubjects();render();load();
</script>
</body></html>
